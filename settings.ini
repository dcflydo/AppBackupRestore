[AppSettings]
Version=2.1.0
Theme=System
DefaultBackupPath=C:\Backup
MaxBackupThreads=4
IncludeRegistry=true
IncludeAppData=true
ScanDepth=3

[SpecialSoftwareNames]
; 特殊软件名映射，格式：显示名称=别名1,别名2,别名3
; 扫描时，匹配到别名的软件会被合并到"显示名称"软件中
; 支持部分匹配（如 "Everything 1.4 Lite" 会匹配别名 "Everything Lite"）
; 注意：别名匹配时忽略大小写

; ── 自动化/RPA 工具 ──
影刀=ShadowBot,ShadowBotBrowser
UiBot=UiBot,UiBotCreator

; ── 设计工具 ──
Affinity Photo=Affinity,Affinity Photo 2
Zen Browser=Zen

; ── 密码/安全工具 ──
Passware=Passware

; ── 即时通讯 ──
钉钉=DingDing,DingTalk
企业微信=WXWork
微信=WeChat,WeChatWin,Weixin
QQ=TencentQQ,QQProtect,QQGameHall,QQNT,QQ,Tencent,TX
腾讯QQ=TencentQQ,QQProtect,QQGameHall,QQNT,QQ,Tencent,TX
飞书=Feishu,LarkShell,Lark
Skype=Skype
LINE=LINE

; ── 输入法 ──
搜狗拼音=SogouInput,SogouPY,SogouPinyin
手心输入法=PalmInput,PalmInputIME
百度输入法=BaiduPinyin,BaiduIME,BaiduInput
讯飞输入法=IFlyIME,IFlytekIME,iflytek
QQ输入法=QQPY,QQPinyin,QQInput

; ── 安全软件 ──
火绒=Huorong,HipsDaemon
360安全卫士=360Safe,360sd,QHSafeMain,360Tray
360杀毒=360Antivirus,360AV
腾讯电脑管家=QQPCMgr,PCMgr
金山毒霸=Kav,KAVAgent,KAVStart,KvMonXP
瑞星=Rising,RavTask,RavMon

; ── 浏览器 ──
QQ浏览器=QQBrowser,TencentBrowser
搜狗浏览器=SogouExplorer,SogouBrowser
360浏览器=360Chrome,se360,360Browser
2345浏览器=2345Browser,2345Explorer
UC浏览器=UCBrowser,UCPlayer

; ── 下载工具 ──
