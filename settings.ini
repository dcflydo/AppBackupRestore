IDM=IDMan,IDMIntegration,Internet Download Manager
Motrix=Motrix

; ── 网盘/同步 ──
百度网盘=BaiduNetdisk,baiduyunguanjia,BDNetdisk,YunDetectService
微云同步助手=WeiyunSync,weiyun
OneDrive=OneDrive,SkyDrive
阿里云盘=AliYunDrive,aDrive
坚果云=NutStore,NutstoreService

; ── 办公/效率 ──
WPS Office=WPS,WPSOffice,wpscloudlaunch,WPSCEF
钉钉文档=dingtalk_doc
金山文档=KDocs
有道云笔记=YoudaoNote,YoudaoCloudNote
印象笔记=Evernote
滴答清单=TickTick
ToDesk=ToDesk,ToDesktop
向日葵=sunlogin,SunLoginClient,Sunflower

; ── 影音/娱乐 ──
爱奇艺=iQIYI,iqiyiService
优酷=Youku
腾讯视频=QQLive,TencentVideo
芒果TV=MGTV
