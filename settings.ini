; ── 其他常见工具 ──
Everything=Everything

[ImeFilePatterns]
; 输入法文件名映射，用于匹配 Windows 系统目录下的 .ime/.dll 文件
; 格式：软件显示名（与 SpecialSoftwareNames 一致）=对应的文件名模式1,文件名模式2,...
; 注意：文件名模式匹配忽略大小写
搜狗拼音=SogouPY,SogouTSF,SogouIME,SogouInput
手心输入法=PalmInput,PalmInputIME

[ImeGenericKeywords]
; 输入法通用词黑名单，这些关键词太宽泛，会导致跨品牌误扫
; 在 ImeFilePatterns 匹配时会被跳过
输入法,拼音,输入,五笔,IME,TSF

[CommonWords]
; 常见词黑名单，这些词不会被提取为搜索关键词
; 避免因短关键词或常见词导致误匹配
Browser,Player,Viewer,Studio,Professional,Enterprise,Community,Edition
Windows,Microsoft,Google,Photo,Video,Audio,Image,Manager,Helper
